name: macos-arm64-engine

# the command-line engine package for applications that embed MiKTeX
# (MarchTeX): no Qt, no user interface, relocatable; see
# macos-port/engine/INTEGRATION.md

on:
  push:
    # an engine release: engine-<MiKTeX version>-<n>, e.g. engine-26.5-1
    tags: ['engine-*']
  # a test build: the package as an artifact, no release
  workflow_dispatch:

permissions:
  contents: read

# not the dmg's group: concurrency groups are shared by all workflows of
# the repository
concurrency:
  group: macos-arm64-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engine:
    # arm64 (Apple Silicon) macOS runner; the Homebrew bottles of the
    # runner determine the minimum macOS version of the package
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # reproducible toolchain: the formula versions of the runner image's
      # Homebrew snapshot and the image's Xcode, no implicit upgrades
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # the minimum macOS version of the package (deployment target and
      # check)
      MACOS_MIN_VERSION: "26.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the manifest records the upstream commit the fork is based on
          fetch-depth: 0

      - name: Install dependencies
        run: |
          # the dmg's list without Qt; hunspell stays: the configuration
          # requires it (USE_SYSTEM_HUNSPELL), although only TeXworks uses it
          brew install pkg-config gettext boost \
            freetype fribidi gmp graphite2 hunspell jpeg-turbo \
            libpng libzzip log4cxx mpfi mpfr pixman popt uriparser xz zlib \
            bzip2 expat curl icu4c openssl@3
          brew list --versions cmake openssl@3 openssl@4 curl icu4c | cat

      - name: Configure
        # - no bundle, no Qt; the bundled cairo, fontconfig, gd, harfbuzz
        #   and mspack (the system ones are not installed, or not in
        #   Homebrew)
        # - the link directory is a path that can never exist: the engine
        #   neither writes links into ~/bin nor runs programs from there
        # - SDKROOT keeps /usr/local/include out of the header search path;
        #   -I puts the openssl@3 headers before /opt/homebrew/include,
        #   whose openssl is openssl@4
        run: |
          BREW="$(brew --prefix)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_MIN_VERSION" \
            -DCMAKE_OSX_SYSROOT=macosx \
            -DCMAKE_C_FLAGS="-I$BREW/opt/openssl@3/include" \
            -DCMAKE_CXX_FLAGS="-I$BREW/opt/openssl@3/include" \
            -DCMAKE_PREFIX_PATH="$BREW;$BREW/opt/icu4c;$BREW/opt/openssl@3;$BREW/opt/bzip2;$BREW/opt/expat;$BREW/opt/curl;$BREW/opt/zlib" \
            -DOPENSSL_ROOT_DIR="$BREW/opt/openssl@3" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/prefix" \
            -DMIKTEX_MACOS_BUNDLE=FALSE \
            -DWITH_UI_QT=FALSE \
            -DMIKTEX_SELF_CONTAINED=TRUE \
            -DUSE_SYSTEM_CAIRO=FALSE \
            -DUSE_SYSTEM_FONTCONFIG=FALSE \
            -DUSE_SYSTEM_GD=FALSE \
            -DUSE_SYSTEM_HARFBUZZ=FALSE \
            -DUSE_SYSTEM_HARFBUZZ_ICU=FALSE \
            -DUSE_SYSTEM_MSPACK=FALSE \
            -DWITH_MAN_PAGES=FALSE \
            -DMIKTEX_USER_LINK_TARGET_DIR=/var/empty/miktex-links

      - name: Name the release
        # an engine release tag must match the MiKTeX version of the
        # sources; it must not match the dmg's tags (*-unofficial.*)
        run: |
          version=$(sed -n 's/^MIKTEX_VERSION_STR:STRING=//p' build/CMakeCache.txt)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::unexpected MiKTeX version: $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ $GITHUB_REF_NAME =~ ^engine-${version//./\\.}-[1-9][0-9]*$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match engine-$version-<n>"
              exit 1
            fi
            release=${GITHUB_REF_NAME#engine-}
          else
            release=$version-dev
          fi
          echo "MIKTEX_VERSION=$version" >> "$GITHUB_ENV"
          echo "ENGINE_ARCHIVE=miktex-engine-unofficial-$release-darwin-arm64.tar.xz" >> "$GITHUB_ENV"
          echo "release: $release"

      - name: Build
        env:
          # the bootstrapping downloads go through ctan.org's rotating
          # mirrors; retry them, also on TLS errors
          CURL_HOME: ${{ runner.temp }}/curl
        run: |
          mkdir -p "$CURL_HOME"
          printf 'retry = 5\nretry-all-errors\n' > "$CURL_HOME/.curlrc"
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Check the OpenSSL headers
        # libmiktex-core links libcrypto.3 (openssl@3); it must be compiled
        # with the openssl@3 headers, not the openssl@4 ones
        run: |
          openssl3="$(brew --prefix)/opt/openssl@3/include/openssl/"
          headers=$(ninja -C build -t deps | sed -n 's/^ *\(.*\/openssl\/[^/]*\.h\)$/\1/p' | sort -u)
          if [ -z "$headers" ]; then
            echo "::error::no OpenSSL header in the dependency log"
            exit 1
          fi
          others=$(grep -v -F "$openssl3" <<< "$headers" || true)
          if [ -n "$others" ]; then
            echo "::error::OpenSSL headers outside $openssl3:"
            echo "$others"
            exit 1
          fi
          echo "OpenSSL headers: $(wc -l <<< "$headers" | tr -d ' '), all in $openssl3"

      - name: Test
        # serial: parallel ctest has known ordering flakes (see docs/macos-port/NOTES.md)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        # package-engine.sh makes the tree self-contained; make-links.sh
        # runs the first-time setup in a temporary home (offline) and makes
        # the commands in bin/
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/staging"
          out=$RUNNER_TEMP/out
          mkdir -p "$out"
          bash macos-port/engine/package-engine.sh "$RUNNER_TEMP/staging" "$out/miktex" "$out/closure.tsv"
          bash macos-port/engine/make-links.sh "$out/miktex" "$out/links.tsv"
          cp macos-port/engine/INTEGRATION.md "$out/miktex/"
          bash macos-port/engine/verify-engine.sh "$out/miktex" "$MACOS_MIN_VERSION" "$out/minos.tsv"
          git fetch --no-tags --quiet https://github.com/MiKTeX/miktex.git next
          # its own assignment: a failure must stop the step
          upstream=$(git merge-base HEAD FETCH_HEAD)
          python3 -I macos-port/engine/make-manifest.py \
            --engine "$out/miktex" \
            --closure "$out/closure.tsv" \
            --links "$out/links.tsv" \
            --minos "$out/minos.tsv" \
            --miktex-version "$MIKTEX_VERSION" \
            --max-min-version "$MACOS_MIN_VERSION" \
            --tag "$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME")" \
            --fork-commit "$GITHUB_SHA" \
            --upstream-commit "$upstream" \
            --build "runner_image=${ImageOS:-}-${ImageVersion:-}" \
            --build "macos=$(sw_vers -productVersion)" \
            --build "xcode=$(xcodebuild -version | head -1)" \
            --build "cmake=$(cmake --version | head -1)" \
            --build "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output "$out/miktex/engine-manifest.json"

      - name: Archive
        # no extended attributes, AppleDouble files, ACLs or file flags in
        # the archive (bsdtar stores xattrs such as com.apple.provenance as
        # pax headers unless told not to)
        run: |
          out=$RUNNER_TEMP/out
          dist=$RUNNER_TEMP/dist
          mkdir -p "$dist"
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata --no-acls --no-fflags \
            -cJf "$dist/$ENGINE_ARCHIVE" -C "$out" miktex
          outside=$(tar -tf "$dist/$ENGINE_ARCHIVE" | grep -Ev '^miktex(/|$)' || true)
          if [ -n "$outside" ]; then
            echo "::error::the archive has entries outside miktex/:"
            echo "$outside"
            exit 1
          fi
          cp "$out/miktex/engine-manifest.json" "$dist/"
          cd "$dist"
          shasum -a 256 "$ENGINE_ARCHIVE" engine-manifest.json > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Verify the archive
        # unpack to a path with a space (the engine was packaged elsewhere),
        # check it again and start two programs there
        run: |
          dist=$RUNNER_TEMP/dist
          moved="$RUNNER_TEMP/Test Dir"
          mkdir -p "$moved"
          tar -xf "$dist/$ENGINE_ARCHIVE" -C "$moved"
          cmp "$moved/miktex/engine-manifest.json" "$dist/engine-manifest.json"
          bash macos-port/engine/verify-engine.sh "$moved/miktex" "$MACOS_MIN_VERSION"
          data="$RUNNER_TEMP/smoke data"
          mkdir -p "$RUNNER_TEMP/smoke home" "$data/texmfs/config/miktex/config"
          : > "$data/texmfs/config/miktex/config/miktexstartup.ini"
          for cmd in miktex pdflatex; do
            env -i HOME="$RUNNER_TEMP/smoke home" PATH="$moved/miktex/bin:/usr/bin:/bin" \
              MIKTEX_USERCONFIG="$data/texmfs/config" \
              MIKTEX_USERDATA="$data/texmfs/data" \
              MIKTEX_USERINSTALL="$data/texmfs/install" \
              MIKTEX_USERSTARTUPFILE="$data/texmfs/config/miktex/config/miktexstartup.ini" \
              "$moved/miktex/bin/$cmd" --version
          done

      # always: the logs of the sandbox tools, the inputs of the license
      # collection and the manifest (closure, links, minos)
      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-build-info
          path: |
            build/sandbox/miktex/log/
            ${{ runner.temp }}/out/*.tsv
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miktex-engine-darwin-arm64
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 14

  release:
    # an engine release tag makes a draft pre-release; a maintainer
    # publishes it after the acceptance test (a pre-release never becomes
    # the repository's latest release, which stays the dmg)
    if: github.ref_type == 'tag'
    needs: build-engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: miktex-engine-darwin-arm64
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh does not check for an existing draft; a re-run must not
          # create a second release for the same tag
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "::error::a release (or draft) for $GITHUB_REF_NAME exists; delete it before re-running"
            exit 1
          fi
          cd dist
          sha256sum -c SHA256SUMS
          {
            echo "The command-line MiKTeX engine for applications that embed it (MarchTeX)."
            echo "**Not for end users**: to install MiKTeX, use the dmg of the latest release."
            echo
            echo "- arm64 only, macOS $(python3 -c 'import json; print(json.load(open("engine-manifest.json"))["macos"]["min_version"])') or later; no Qt, no user interface"
            echo "- relocatable; ad-hoc signed; see INTEGRATION.md in the archive:"
            echo "  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/macos-port/engine/INTEGRATION.md"
            echo "- engine-manifest.json describes the contents"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Built from commit $GITHUB_SHA."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" miktex-engine-*.tar.xz engine-manifest.json SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --verify-tag \
            --title "MiKTeX engine $GITHUB_REF_NAME for Apple Silicon (unofficial; for embedding, not for end users)" \
            --notes-file notes.md
